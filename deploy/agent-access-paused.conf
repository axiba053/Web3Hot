# Temporary public-access suspension. Include inside this site's HTTPS server.
# Backend HTTP remains private to Docker so SSR (including /btc) continues working.
location ~ ^/(?:agent(?:/|\.data|$)|api/(?:v1|mcp)(?:/|$)|feed(?:/|\.xml|$)|(?:rss(?:\.xml)?|atom\.xml|llms\.txt|openapi-v1\.json)(?:/|$)) {
    default_type text/plain;
    add_header Cache-Control "no-store" always;
    return 404 "Not found\n";
}
